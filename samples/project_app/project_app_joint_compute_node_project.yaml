    - { id: rope-0-05, type: distance, a: { body: rope-link_024, anchor: down }, b: { body: rope-link_030, anchor: up }, lengthMeters: 0.025, compliance: 0.0, positionCorrectionSlop: 0.0001, collideConnected: false }
    - { id: rope-0-06, type: distance, a: { body: rope-link_030, anchor: down }, b: { body: rope-link_036, anchor: up }, lengthMeters: 0.025, compliance: 0.0, positionCorrectionSlop: 0.0001, collideConnected: false }
    - { id: rope-0-07, type: distance, a: { body: rope-link_036, anchor: down }, b: { body: rope-link_042, anchor: up }, lengthMeters: 0.025, compliance: 0.0, positionCorrectionSlop: 0.0001, collideConnected: false }
