    - { id: rope-1-01, type: distance, a: { body: rope-link_001, anchor: down }, b: { body: rope-link_007, anchor: up }, lengthMeters: 0.025, compliance: 0.0, positionCorrectionSlop: 0.0001, collideConnected: false }
