# primitive objectの形状、初期姿勢、材質、physics bodyを記述します。
objects:
  - id: pendulum-pivot
    shape: { type: sphere, radius: 0.025 }
    transform: { position: [-2.8, 5.55, -0.18] }
    material: pendulum-pivot-material
    physics:
      bodyType: static
      shape: { type: sphere, radius: 0.025 }
      collisionLayer: 8
      collisionMask: 0
      material: { friction: 0.0, restitution: 0.0 }

  - id: pendulum-weight
    shape: { type: sphere, radius: 0.18 }
    transform: { position: [-2.036, 3.451, -0.18] }
    material: pendulum-weight-material
    physics:
      bodyType: dynamic
      mass: 1.0
      shape: { type: sphere, radius: 0.18 }
      linearDamping: 0.00875
      angularDamping: 0.02
      allowSleep: false
      collisionLayer: 8
      collisionMask: 0
      material: { friction: 0.0, restitution: 0.0 }

  - id: pendulum-connector
    shape: { type: capsule, radius: 0.0175, segmentLength: 2.199 }
    transform:
      position: [-2.418, 4.500, -0.18]
      orientation: [0.0, 0.0, 0.0]
    material: pendulum-connector-material

  - id: crossing-capsule
    shape: { type: capsule, radius: 0.33, segmentLength: 1.2 }
    transform:
      position: [-3.3, 4.0, 0.0]
      orientation: [90.0, 0.0, 0.0]
    material: crossing-capsule-material
    physics:
      bodyType: kinematic
      mass: 8.0
      shape: { type: capsule, radius: 0.33, segmentLength: 1.2 }
      gravityScale: 0.0
      allowSleep: false
      fixedRotation: true
      collisionLayer: 4
      collisionMask: 2
      material: { friction: 0.0, restitution: 0.0 }

# 同じcapsuleをX方向6列、Y方向10段へ展開します。
# 各列のZは0.08mずつずらし、交差するCapsuleとの接触を立体的に観察できます。
objectSets:
  # pivotのX/Z配置はrope-link objectSetの6列と一致します。
  - id: rope-pivot
    prototype:
      shape: { type: sphere, radius: 0.1 }
      material: rope-pivot-material
      physics:
        bodyType: static
        shape: { type: sphere, radius: 0.1 }
        anchors: { down: { localPoint: [0.0, -0.14, 0.0] } }
        collisionLayer: 2
        collisionMask: 0
        material: { friction: 0.0, restitution: 0.0 }
    placement:
      type: grid3d
      count: [6, 1, 1]
      origin: [-1.8, 5.55, -0.18]
      spacing: [0.72, 0.0, 0.08]

  - id: rope-link
    variants:
      - id: even
        shape: { type: capsule, radius: 0.06, segmentLength: 0.18 }
        material: rope-link-even-material
        physics:
          bodyType: dynamic
          mass: 0.50
          shape: { type: capsule, radius: 0.06, segmentLength: 0.18 }
          linearDamping: 0.30
          angularDamping: 0.82
          allowSleep: true
          collisionLayer: 2
          collisionMask: 4
          anchors:
            up: { localPoint: [0.0, 0.14, 0.0] }
            down: { localPoint: [0.0, -0.14, 0.0] }
          material: { friction: 0.0, restitution: 0.0 }
      - id: odd
        shape: { type: capsule, radius: 0.06, segmentLength: 0.18 }
        material: rope-link-odd-material
        physics:
          bodyType: dynamic
          mass: 0.50
          shape: { type: capsule, radius: 0.06, segmentLength: 0.18 }
          linearDamping: 0.30
          angularDamping: 0.82
          allowSleep: true
          collisionLayer: 2
          collisionMask: 4
          anchors:
            up: { localPoint: [0.0, 0.14, 0.0] }
            down: { localPoint: [0.0, -0.14, 0.0] }
          material: { friction: 0.0, restitution: 0.0 }
    variantPattern:
      type: cycle
      values: [even, odd]
    placement:
      type: grid3d
      count: [6, 10, 1]
      origin: [-1.8, 5.245, -0.18]
      spacing: [0.72, -0.305, 0.08]

# PBR rendererのprofileと画面効果をproject側で固定します。
renderer:
  profile: studio
  width: 960
  height: 640
  clearColor: [0.012, 0.026, 0.036, 1.0]
  environment:
    preset: dark-studio
    resolution: { width: 128, height: 64 }
  dof: { enabled: false }
  pipeline:
    lighting: { ambient: 0.0, directionalIntensity: 1.05, environmentIntensity: 0.42 }
    ssao: { radius: 12.0, strength: 1.15, samples: 8 }
    ssr: { intensity: 0.65, distance: 24.0, steps: 28 }
    toneMap: { exposure: 1.0 }
