# joint_compute_nodeと同じGPU JointシナリオをSceneYAMLで記述するprojectです。
# 物理body、Distance Joint、PBR material、表示用primitiveを一つのデータへまとめます。
name: project-app-joint-compute-node
version: 1

# Compute bodyの色を画面上で区別するPBR materialです。
materials:
  - id: pendulum-pivot-material
    color: [1.00, 0.54, 0.08, 1.0]
    metallic: 0.12
    roughness: 0.24
    specular: 0.92
  - id: pendulum-weight-material
    color: [0.98, 0.16, 0.14, 1.0]
    metallic: 0.10
    roughness: 0.22
    specular: 0.95
  - id: rope-pivot-material
    color: [0.98, 0.68, 0.12, 1.0]
    metallic: 0.08
    roughness: 0.28
    specular: 0.90
  - id: rope-link-even-material
    color: [0.10, 0.78, 0.42, 1.0]
    metallic: 0.06
    roughness: 0.30
    specular: 0.88
  - id: rope-link-odd-material
    color: [0.62, 0.90, 0.18, 1.0]
    metallic: 0.06
    roughness: 0.30
    specular: 0.88
  - id: crossing-capsule-material
    color: [0.08, 0.82, 0.94, 1.0]
    metallic: 0.12
    roughness: 0.22
    specular: 0.94
  - id: pendulum-connector-material
    color: [0.96, 0.90, 0.58, 1.0]
    metallic: 0.18
    roughness: 0.24
    specular: 0.92

# 重力、固定step、GPU容量、PlaneをScenePhysicsへ渡します。
physics:
  space:
    gravity: [0.0, -9.80665, 0.0]
    fixedTimeStepMs: 8.3333333333
    maxSubSteps: 8
    solverIterations: 10
    jointSolverIterations: 16
    maxBodies: 80
    maxJoints: 80
    maxJointsPerBody: 4
    defaultRestitution: 0.0
    defaultFriction: 0.0
    persistentSleep: true
    bounds: { minX: -4.0, maxX: 4.0, minZ: -2.8, maxZ: 2.8 }
    scale: { referenceLength: 0.08 }
    # joint_compute_nodeと同じく、ロープと振り子は空間中で動きます。
    planes: []
  joints:
    # 振り子の支点と重りをDistance Jointでつなぎます。
    - id: pendulum-distance
      type: distance
      a: { body: pendulum-pivot, localPoint: [0.0, 0.0, 0.0] }
      b: { body: pendulum-weight, localPoint: [0.0, 0.0, 0.0] }
      lengthMeters: 2.234
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false

    # rope-link objectSetはcount=[6,10,1]で、X方向6列、Y方向10段を作ります。
    # IDはrope-link_000〜rope-link_059です。index=(row * 6 + column)で列を参照します。
    # 各列の最上段だけpivotのtop anchorへつなぎ、以降は前段bottomと次段topをつなぎます。
    - id: rope-0-top
      type: distance
      a: { body: rope-pivot_000, anchor: down }
      b: { body: rope-link_000, anchor: up }
      lengthMeters: 0.025
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false
    - id: rope-1-top
      type: distance
      a: { body: rope-pivot_001, anchor: down }
      b: { body: rope-link_001, anchor: up }
      lengthMeters: 0.025
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false
    - id: rope-2-top
      type: distance
      a: { body: rope-pivot_002, anchor: down }
      b: { body: rope-link_002, anchor: up }
      lengthMeters: 0.025
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false
    - id: rope-3-top
      type: distance
      a: { body: rope-pivot_003, anchor: down }
      b: { body: rope-link_003, anchor: up }
      lengthMeters: 0.025
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false
    - id: rope-4-top
      type: distance
      a: { body: rope-pivot_004, anchor: down }
      b: { body: rope-link_004, anchor: up }
      lengthMeters: 0.025
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false
    - id: rope-5-top
      type: distance
      a: { body: rope-pivot_005, anchor: down }
      b: { body: rope-link_005, anchor: up }
      lengthMeters: 0.025
      compliance: 0.0
      positionCorrectionSlop: 0.0001
      collideConnected: false

    # 各列の10個のlinkを順に接続します。
    - { id: rope-0-01, type: distance, a: { body: rope-link_000, anchor: down }, b: { body: rope-link_006, anchor: up }, lengthMeters: 0.025, compliance: 0.0, positionCorrectionSlop: 0.0001, collideConnected: false }
    - { id: rope-0-02, type: distance, a: { body: rope-link_006, anchor: down }, b: { body: rope-link_012, anchor: up }, lengthMeters: 0.025, compliance: 0.0, positionCorrectionSlop: 0.0001, collideConnected: false }
