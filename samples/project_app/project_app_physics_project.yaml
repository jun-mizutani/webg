# Blender制作のscene assetと外部PBR materialを接続するSceneYAML projectです。
# objects[]はscene assetのNode IDとCompute physics bodyの対応を記述します。
name: general-model-object-physics-runtime
version: 1
# 表示するBlender scene assetと外部SceneYAML material manifestです。
sceneAssetUrl: ./assets/domino2_scene_asset.json.gz
materialsUrl: ./project_app_physics_materials.yaml
# 重力、時間刻み、境界、床の接触面を定義します。
physics:
  space:
    gravity: [0.0, -9.8, 0.0]
    fixedTimeStepMs: 4.1666666667
    maxSubSteps: 8
    solverIterations: 14
    maxBodies: 9
    defaultRestitution: 0.08
    defaultFriction: 0.58
    persistentSleep: true
    bounds: { minX: -9.0, maxX: 9.0, minZ: -7.0, maxZ: 7.0 }
    scale: { referenceLength: 0.08 }
    # 高さ0mに床の無限平面を置きます。
    planes:
      - normal: [0.0, 1.0, 0.0]
        planeDistance: 0.0
# scene assetのNodeへ対応するCompute physics bodyです。
objects:
  # 背面の壁を静的bodyとして登録します。
  - id: room-back-wall
    node: node_1
    material: mat_1
    physics:
      bodyType: static
      shape:
        type: box
        size: [18.0, 12.0, 0.3]
      material: { restitution: 0.0, friction: 0.65 }
  # 左側の壁を静的bodyとして登録します。
  - id: room-left-wall
    node: node_2
    material: mat_2
    physics:
      bodyType: static
      shape:
        type: box
        size: [0.3, 12.0, 14.0]
      material: { restitution: 0.0, friction: 0.65 }
  # 右側の壁を静的bodyとして登録します。
  - id: room-right-wall
    node: node_3
    material: mat_3
    physics:
      bodyType: static
      shape:
        type: box
        size: [0.3, 12.0, 14.0]
      material: { restitution: 0.0, friction: 0.65 }
  # レールを表示shapeと一致する静的colliderとして登録します。
  - id: rail
    node: node_10
    material: mat_10
    physics:
      bodyType: static
      colliderRelation: match
      shape:
        type: box
        size: [4.8, 0.36, 0.72]
      material: { restitution: 0.04, friction: 0.56 }
  # 球を受ける固定板を静的bodyとして登録します。
  - id: bounce-board-01
    node: node_13
    material: mat_13
    physics:
      bodyType: static
      shape:
        type: box
        size: [1.55, 0.32, 0.78]
      material: { restitution: 0.32, friction: 0.52 }
  # 操作対象の板を静的bodyとして登録します。
  - id: movable-board
    node: node_14
    material: mat_14
    physics:
      bodyType: static
      shape:
        type: box
        size: [1.7, 0.36, 0.84]
      material: { restitution: 0.32, friction: 0.52 }
  # scene assetの球をdynamic bodyとして登録します。
  - id: ball
    node: node_15
    material: mat_15
    physics:
      bodyType: dynamic
      colliderRelation: match
      shape: { type: sphere, radius: 0.3 }
      mass: 1.0
      linearDamping: 0.08
      angularDamping: 0.08
      material: { restitution: 0.12, friction: 0.48 }
  # ゴール背面の部品を静的bodyとして登録します。
  - id: goal-back
    node: node_16
    material: mat_16
    physics:
      bodyType: static
      shape:
        type: box
        size: [0.25, 2.9, 1.7]
      material: { restitution: 0.32, friction: 0.52 }
  # ゴール上部の部品をproxy colliderで登録します。
  - id: goal-top
    node: node_17
    material: mat_17
    physics:
      bodyType: static
      colliderRelation: proxy
      shape:
        type: box
        size: [1.625, 0.21, 1.7]
      material: { restitution: 0.32, friction: 0.52 }
# PBR profile、被写界深度、画面効果の設定です。
renderer:
  profile: studio
  width: 960
  height: 640
  clearColor: [0.018, 0.022, 0.028, 1.0]
  environment:
    preset: dark-studio
    resolution: { width: 128, height: 64 }
  dof:
    enabled: true
    focus: { source: camera, rangeMeters: 3.0, transitionMeters: 0.8 }
    blurRadius: 0.7
  pipeline:
    lighting: { ambient: 0.0, directionalIntensity: 1.05, environmentIntensity: 0.42 }
    ssao: { radius: 18.0, strength: 1.3, samples: 8 }
    ssr: { intensity: 0.74, distance: 28.0, steps: 32 }
    toneMap: { exposure: 1.0 }
