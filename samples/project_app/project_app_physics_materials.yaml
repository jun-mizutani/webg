# Blender scene assetの各materialへ対応するSceneYAML PBR manifestです。
# pbrは一様な材質、presetは手続き生成する材質を表します。
# 床、壁、テーブル、レール、板、球、ゴールの順に並べています。
# 床に使う暗い色のPBRマテリアルです。
- assetMaterialId: mat_0
  materialId: model-project-floor
  pbr:
    color: [0.24, 0.28, 0.34, 1.0]
    metallic: 0.0
    roughness: 0.38
    specular: 0.72
# 背面壁の明るいPBRマテリアルです。
- assetMaterialId: mat_1
  materialId: model-project-back-wall
  pbr:
    color: [0.86, 0.93, 0.97, 1.0]
    metallic: 0.0
    roughness: 0.72
    specular: 0.72
