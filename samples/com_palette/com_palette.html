<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Command Palette Sample</title>
  <link rel="icon" href="data:," />
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0c1218;
      color: #eaf3ff;
      font-family: ui-sans-serif, system-ui, "Yu Gothic", sans-serif;
      touch-action: none;
    }

    #stage {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .hud {
      position: fixed;
      left: 16px;
      top: 14px;
      z-index: 10;
      width: min(360px, calc(100vw - 32px));
      color: rgba(235, 246, 255, 0.92);
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud" class="hud"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
