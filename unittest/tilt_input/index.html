<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>webg unittest tilt input</title>
  <link rel="icon" href="data:," />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10161b;
      color: #e9f2ff;
      font-family: system-ui, sans-serif;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 4;
      white-space: pre;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #eaf6ff;
      background: rgba(8, 14, 20, 0.76);
      border: 1px solid rgba(178, 215, 244, 0.22);
      border-radius: 8px;
      padding: 9px 11px;
      pointer-events: none;
    }
    .tilt-panel {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      width: min(330px, calc(100vw - 28px));
      display: grid;
      gap: 10px;
      padding: 12px;
      background: rgba(8, 14, 20, 0.82);
      border: 1px solid rgba(178, 215, 244, 0.22);
      border-radius: 8px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      user-select: none;
      -webkit-user-select: none;
    }
    .tilt-pad {
      position: relative;
      height: 210px;
      border-radius: 8px;
      border: 1px solid rgba(203, 227, 248, 0.28);
      background:
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(224, 240, 255, 0.35) 50%, transparent calc(50% + 1px)),
        linear-gradient(0deg, transparent calc(50% - 1px), rgba(224, 240, 255, 0.35) 50%, transparent calc(50% + 1px)),
        radial-gradient(circle at 50% 50%, rgba(70, 154, 228, 0.16), rgba(16, 29, 40, 0.95));
      touch-action: none;
      overflow: hidden;
    }
    .tilt-vector {
      position: absolute;
      left: 50%;
      top: 50%;
      height: 4px;
      width: 1px;
      transform-origin: 0 50%;
      background: linear-gradient(90deg, #91f4ff, #ffec8a);
      border-radius: 99px;
      box-shadow: 0 0 12px rgba(145, 244, 255, 0.5);
    }
    .tilt-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 35% 30%, #fff8c7, #ffb22e 62%, #b95d11);
      box-shadow: 0 0 0 1px rgba(255, 248, 214, 0.5), 0 8px 20px rgba(255, 178, 46, 0.42);
    }
    .tilt-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tilt-buttons button {
      border: 1px solid rgba(213, 232, 248, 0.26);
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(42, 72, 98, 0.84);
      color: #f2f8ff;
      font: 13px/1.2 system-ui, sans-serif;
    }
    .tilt-buttons button:active {
      background: rgba(68, 116, 158, 0.94);
    }
    .tilt-help {
      color: #b9cad8;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="960" height="720"></canvas>
  <div id="status">starting...</div>
  <section class="tilt-panel" aria-label="tilt input emulator">
    <div class="tilt-pad" id="tiltPad">
      <div class="tilt-vector" id="tiltVector"></div>
      <div class="tilt-dot" id="tiltDot"></div>
    </div>
    <div class="tilt-buttons">
      <button id="deviceButton" type="button">Device</button>
      <button id="calibrateButton" type="button">Calibrate</button>
      <button id="resetButton" type="button">Reset</button>
      <button id="emulateButton" type="button">Emulate</button>
    </div>
    <div class="tilt-help">
      Drag the pad, or use Arrow/WASD. Device uses deviceorientation when available.
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
