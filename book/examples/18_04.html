<!doctype html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>18_04 独自の効果音</title>
  <link rel="stylesheet" href="./example.css" />
  <style>
    button { margin: 6px 8px 6px 0; padding: 8px 14px; }
    #status { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>18_04 独自の効果音</h2>
    <div class="section-card">
      <p>`playGameTone()` を複数重ね、アプリ側の関数として独自 SE を構築する例です</p>
      <p class="note">Treasure Open は短い音を数十ミリ秒ずらして重ね、単純なビープ音よりも奥行きのある SE にします</p>
      <button id="startButton">Audio Start</button>
      <button id="playButton" disabled>Treasure Open</button>
      <p id="status">status: waiting for Audio Start</p>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import GameAudioSynth from "../../webg/GameAudioSynth.js";

const synth = new GameAudioSynth();
const startButton = document.getElementById("startButton");
const playButton = document.getElementById("playButton");
const status = document.getElementById("status");

const setStatus = (text) => {
  status.textContent = `status: ${text}`;
};

function playTreasureOpen() {
  const t0 = synth.ctx.currentTime;

  // 最初の明るい立ち上がり
  synth.playGameTone(523.25, 0.08, "guitar", {
    when: t0,
    type: "triangle",
    gain: 0.07,
    release: 0.06,
    pan: -0.08
  });

  // 少し遅れて和音感を足す
  synth.playGameTone(783.99, 0.12, "piano", {
    when: t0 + 0.040,
    type: "triangle",
    gain: 0.06,
    release: 0.10,
    pan: 0.06
  });

  // 高域のきらめき
  synth.playGameTone(1174.66, 0.16, "woodwind", {
    when: t0 + 0.090,
    type: "sine",
    gain: 0.04,
    release: 0.16,
    pan: 0.20
  });
}

startButton.addEventListener("click", async () => {
  await synth.resume();
  synth.setMasterVolume(0.25);
  synth.setSeVolume(0.90);
  synth.setSeReverb(0.28, 0.50);
  startButton.disabled = true;
  playButton.disabled = false;
  setStatus("audio started");
});

playButton.addEventListener("click", () => {
  playTreasureOpen();
  setStatus("playTreasureOpen()");
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
