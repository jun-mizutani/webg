<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>18_05 音声ファイル（AudioBuffer）の利用</title>
  <link rel="stylesheet" href="./example.css" />
  <style>
    button { margin: 6px 8px 6px 0; padding: 8px 14px; }
    #status { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>18_05 音声ファイル（AudioBuffer）の利用</h2>
    <div class="section-card">
      <p>`AudioSynth.loadAudioBuffer()` と `playAudioBuffer()` で、音声ファイルを SE/BGM bus へ流す例です</p>
      <p class="note">外部ファイルを置かずに1ファイルで実行できるよう、この例では短い wav を Blob として生成し、それを URL 経由で読み込んでいます</p>
      <button id="startButton">Audio Start + Load Buffer</button>
      <button id="playSeButton" disabled>Play Buffer as SE</button>
      <button id="playLoopButton" disabled>Start Buffer Loop</button>
      <button id="stopLoopButton" disabled>Stop Loop</button>
      <p id="status">status: waiting for Audio Start</p>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import AudioSynth from "../../webg/AudioSynth.js";

const synth = new AudioSynth();
const startButton = document.getElementById("startButton");
const playSeButton = document.getElementById("playSeButton");
const playLoopButton = document.getElementById("playLoopButton");
const stopLoopButton = document.getElementById("stopLoopButton");
const status = document.getElementById("status");

let loopVoice = null;

const setStatus = (text) => {
  status.textContent = `status: ${text}`;
};

const writeString = (view, offset, text) => {
  for (let i = 0; i < text.length; i++) {
    view.setUint8(offset + i, text.charCodeAt(i));
  }
};

const makeToneWavBlob = ({ frequency = 440, seconds = 0.45, sampleRate = 44100 } = {}) => {
  const sampleCount = Math.floor(sampleRate * seconds);
  const bytesPerSample = 2;
  const dataSize = sampleCount * bytesPerSample;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  writeString(view, 0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  writeString(view, 8, "WAVE");
  writeString(view, 12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * bytesPerSample, true);
  view.setUint16(32, bytesPerSample, true);
  view.setUint16(34, 8 * bytesPerSample, true);
  writeString(view, 36, "data");
  view.setUint32(40, dataSize, true);

  for (let i = 0; i < sampleCount; i++) {
    const t = i / sampleRate;
    const envelope = Math.max(0.0, 1.0 - t / seconds);
    const sample = Math.sin(Math.PI * 2 * frequency * t) * envelope * 0.55;
    view.setInt16(44 + i * bytesPerSample, Math.round(sample * 32767), true);
  }

  return new Blob([buffer], { type: "audio/wav" });
};

startButton.addEventListener("click", async () => {
  await synth.resume();
  synth.setMasterVolume(0.25);
  synth.setSeVolume(0.90);
  synth.setBgmVolume(0.55);
  synth.setSeReverb(0.22, 0.45);
  synth.setBgmReverb(0.18, 0.36);

  const url = URL.createObjectURL(makeToneWavBlob({
    frequency: 523.25,
    seconds: 0.50
  }));
  try {
    await synth.loadAudioBuffer("generated_tone", url);
  } finally {
    URL.revokeObjectURL(url);
  }

  startButton.disabled = true;
  playSeButton.disabled = false;
  playLoopButton.disabled = false;
  stopLoopButton.disabled = false;
  setStatus("AudioBuffer loaded");
});

playSeButton.addEventListener("click", () => {
  synth.playAudioBuffer("generated_tone", {
    bus: "se",
    gain: 0.85,
    pan: -0.15
  });
  setStatus("playAudioBuffer as SE");
});

playLoopButton.addEventListener("click", () => {
  loopVoice?.stop(synth.ctx.currentTime, { fadeSec: 0.08 });
  loopVoice = synth.playAudioBuffer("generated_tone", {
    bus: "bgm",
    loop: true,
    gain: 0.38,
    playbackRate: 0.5
  });
  setStatus("looping AudioBuffer on BGM bus");
});

stopLoopButton.addEventListener("click", () => {
  loopVoice?.stop(synth.ctx.currentTime, { fadeSec: 0.35 });
  loopVoice = null;
  setStatus("loop stopped");
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
