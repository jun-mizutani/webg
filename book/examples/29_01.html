<!doctype html>
<!-- book/examples/29_01.html 2026/10/04 -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>29_01 手続きマテリアルと実寸UV</title>
  <link rel="stylesheet" href="./examples_common.css" />
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>29_01 手続きマテリアルと実寸UV</h2>
    <div class="section-card">
      <p>2×3×4 mの二つの直方体へ、陶製タイルと青いビニールの手続きマテリアルを適用します</p>
      <p><code>mapRealCuboid()</code>が各面へメートル単位のUVを作り、<code>applyTo()</code>がpresetの一周期とscaleから反復回数を求めます</p>
      <p id="status" class="note">手続きテクスチャを生成しています</p>
    </div>
    <div class="canvas-block"><canvas id="canvas" width="960" height="640"></canvas></div>
    <pre id="code"></pre>
    <script type="module" id="example-source">
import WebgApp from "../../webg/WebgApp.js";
import Primitive from "../../webg/Primitive.js";
import ProceduralMaterials from "../../webg/ProceduralMaterials.js";
import Shape from "../../webg/Shape.js";

const status = document.getElementById("status");
const objects = [];
let proceduralMaterials = null;

// WebgAppへカメラ、描画ループ、標準照明をまとめて初期化させます
const app = new WebgApp({
  document,
  canvas: document.getElementById("canvas"),
  fixedCanvasSize: { width: 960, height: 640, useDevicePixelRatio: false },
  clearColor: [0.055, 0.075, 0.11, 1.0],
  ambient: 0.24,
  camera: { target: [0, 0, 0], distance: 8, yaw: 0, pitch: -8 }
});

// meter UVをマテリアルの実寸周期へ換算してからGPU bufferを確定します
function createCuboid(gpu, material) {
  const shape = new Shape(gpu);
  shape.setShader(app.shader);
  shape.applyPrimitiveAsset(Primitive.mapRealCuboid(2.0, 3.0, 4.0));
  material.applyTo(shape);
  shape.endShape();
  return shape;
}

// 同じ物体寸法でマテリアルだけが異なる二つのShapeをsceneへ配置します
function addObject(name, shape, position, speed) {
  const node = app.space.addNode(null, name);
  node.setPosition(...position);
  node.addShape(shape);
  objects.push({ node, speed });
}

// GPU初期化後に手続き材質を生成し、直方体を配置して描画ループを開始する
async function start() {
  try {
    await app.init();
    proceduralMaterials = new ProceduralMaterials(app.getGPU());

    const ceramic = await proceduralMaterials.createPreset(
      "ceramic.white.square",
      { scale: 2.0 }
    );
    const vinyl = await proceduralMaterials.createPreset(
      "vinyl.cloudy.blue",
      { scale: 2.0 }
    );

    addObject("ceramic", createCuboid(app.getGPU(), ceramic), [-2.7, 0, 0], 18);
    addObject("vinyl", createCuboid(app.getGPU(), vinyl), [2.7, 0, 0], -14);

    status.textContent = "生成完了";
    let previousTime = performance.now();
    app.start({
      // 前回からの経過秒数で二つの直方体を回転させ、材質の違いを比較する
      onUpdate: () => {
        const now = performance.now();
        const deltaSeconds = Math.min((now - previousTime) / 1000, 0.1);
        previousTime = now;
        for (const object of objects) {
          object.node.rotate(object.speed * deltaSeconds, object.speed * 0.65 * deltaSeconds, 0);
        }
      }
    });
  } catch (error) {
    status.textContent = `起動失敗: ${error.message}`;
    proceduralMaterials?.destroy();
    throw error;
  }
}

// ページの終了時に、生成した手続き材質のGPUリソースを解放する
window.addEventListener("pagehide", () => proceduralMaterials?.destroy(), { once: true });
start();
    </script>
    <script>
      document.getElementById("code").textContent = document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
