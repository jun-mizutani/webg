<!doctype html>
<!-- book/examples/16_02.html 2026/10/04 -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>16_02 効果音（SE）の再生</title>
  <link rel="stylesheet" href="./examples_common.css" />

</head>
<body class="example-audio">
  <div class="page">
    <h1>book/examples</h1>
    <h2>16_02 効果音（SE）の再生</h2>
    <div class="section-card">
      <p>`GameAudioSynth` を使い、`resume()` 後に `playSe(name)` で名前付き SE を鳴らす例です</p>
      <p class="note">Audio Start 後、`poyoon`、`coin`、`levelup` の各ボタンで SE catalog の音を確認できます</p>
      <button id="startButton">Audio Start</button>
      <button class="seButton" data-se="poyoon" disabled>poyoon</button>
      <button class="seButton" data-se="coin" disabled>coin</button>
      <button class="seButton" data-se="levelup" disabled>levelup</button>
      <p id="status">status: waiting for Audio Start</p>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import GameAudioSynth from "../../webg/GameAudioSynth.js";

const synth = new GameAudioSynth();
const startButton = document.getElementById("startButton");
const seButtons = [...document.querySelectorAll(".seButton")];
const status = document.getElementById("status");

// 操作や処理の結果を、ページ内の状態表示へ文字列として反映する
const setStatus = (text) => {
  status.textContent = `status: ${text}`;
};

// 利用者の開始操作で音声を有効にし、音量と音源を準備して再生ボタンを使える状態へ移す
startButton.addEventListener("click", async () => {
  await synth.resume();

  // 全体と SE の音量、空間を先に整える
  synth.setMasterVolume(0.7);
  synth.setSeVolume(0.90);
  synth.setSeReverb(0.32, 0.55);
  synth.setSeReverbImpulse({
    kind: "room",
    durationSec: 2.2,
    decay: 1.6
  });

  startButton.disabled = true;
  for (let i = 0; i < seButtons.length; i++) {
    seButtons[i].disabled = false;
  }
  setStatus("audio started");
});

for (let i = 0; i < seButtons.length; i++) {
  // 押したボタンの効果音名を使って再生し、選択結果を状態表示へ反映する
  seButtons[i].addEventListener("click", () => {
    const seName = seButtons[i].dataset.se;
    synth.playSe(seName);
    setStatus(`playSe("${seName}")`);
  });
}
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
