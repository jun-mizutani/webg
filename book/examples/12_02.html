<!doctype html>
<!-- book/examples/12_02.html 2026/10/04 -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>12_02 theme switch</title>
  <link rel="stylesheet" href="./examples_common.css" />
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>12_02 theme switch</h2>
    <div class="section-card">
      <p>`book/12_UI表示の設計.md` の `WebgApp.setUiTheme()` を、既定 preset の切り替えだけに絞って確かめる実行例です</p>
      <p class="note">`WebgApp` が管理する `OverlayPanel` を同じ preset へそろえる流れを短い code で見られます。button または `[1]` から `[4]` で theme を切り替えます</p>
    </div>

    <div class="canvas-block">
      <canvas id="canvas" width="960" height="720"></canvas>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import WebgApp from "../../webg/WebgApp.js";
import { buildHelpPanelOptions } from "../../webg/OverlayPanelPresets.js";
import { UI_THEME_PRESETS } from "../../webg/WebgUiTheme.js";

const app = new WebgApp({
  document,
  messageFontTexture: "../../webg/font512.png",
  clearColor: [0.06, 0.08, 0.11, 1.0],
  layoutMode: "embedded",
  fixedCanvasSize: {
    width: 960,
    height: 720,
    useDevicePixelRatio: false
  }
});
await app.init();

const presetEntries = [
  { key: "1", id: "dark" },
  { key: "2", id: "light" },
  { key: "3", id: "sunset" },
  { key: "4", id: "forest" }
];

let currentThemeId = "dark";

// テーマIDから配色を選び、WebgAppのUIと配色の確認パネルをまとめて更新する
function applyThemePreset(themeId) {
  const nextTheme = UI_THEME_PRESETS[themeId];
  if (!nextTheme) {
    throw new Error(`Unknown UI theme preset: ${themeId}`);
  }

  currentThemeId = themeId;
  app.setUiTheme(nextTheme);
  app.showOverlayPanel({
    id: "theme-preview",
    title: `Theme Preview: ${themeId}`,
    lines: [
      `theme=${themeId}`,
      `dockBg=${app.uiTheme.debugDock.rootBackground}`,
      `panelBg=${app.uiTheme.uiPanel.panelBackground}`,
      `buttonBg=${app.uiTheme.uiPanel.buttonBackground}`
    ],
    format: "pre",
    anchor: "top-right",
    width: 300,
    scrollY: true
  });
  app.updateOverlayPanel("theme-controls", {
    title: `WebgApp.setUiTheme() / ${themeId}`,
    lines: [
      "Buttons or [1]-[4] to switch presets",
      `current=${themeId}`
    ]
  });
}

app.showOverlayPanel({
  id: "theme-controls",
  title: "WebgApp.setUiTheme()",
  lines: ["Buttons or [1]-[4] to switch presets"],
  anchor: "top-left",
  width: 320,
  // テーマの定義を、キーの案内付きの操作ボタンへ変換する
  choices: presetEntries.map((entry) => ({
    id: entry.id,
    label: `[${entry.key}] ${entry.id}`
  })),
  // 押したボタンのIDをテーマIDとして受け取り、配色を切り替える
  onAction: ({ actionId }) => applyThemePreset(actionId)
});

app.showOverlayPanel(buildHelpPanelOptions({
  id: "themeExampleHelp",
  anchor: "bottom-left",
  lines: [
    "[1]-[4]: switch theme preset",
    "help / preview overlay update together"
  ]
}));

app.attachInput({
  // 正規化されたキー名から操作を選び、停止状態、表示設定、カメラなどの対象を更新する
  onKeyDown: (key, ev) => {
    if (ev.repeat) return;
    // 入力されたキーに対応するテーマの設定項目を探す
    const entry = presetEntries.find((item) => item.key === key);
    if (entry) {
      applyThemePreset(entry.id);
    }
  }
});

applyThemePreset("dark");

let elapsedSec = 0.0;

app.start({
  // 経過時間を進め、選択中のテーマとUIの操作案内を表示する
  onUpdate: ({ deltaSec }) => {
    elapsedSec += deltaSec;
    app.message.setLines("guide", [
      "theme switch example",
      "DOM UI changes, HUD stays simple"
    ], {
      anchor: "bottom-left",
      x: 0,
      y: -2
    });
    app.message.setLines("status", [
      `theme=${currentThemeId}`,
      `time=${elapsedSec.toFixed(1)} sec`
    ], {
      anchor: "top-left",
      x: 0,
      y: 0
    });
  }
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
