<!doctype html>
<!-- webg/book/examples/16_01.html 2026/05/15 -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>16_01 TouchSurface gesture</title>
  <link rel="stylesheet" href="./example.css" />
  <style>
    .gesture-surface {
      height: 460px;
      display: grid;
      place-items: center;
      border: 1px solid #b9c5e0;
      border-radius: 12px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        radial-gradient(circle at 50% 40%, rgba(69, 155, 238, 0.24), transparent 46%),
        #10151f;
      background-size: 32px 32px, 32px 32px, auto, auto;
      color: #e9efff;
      user-select: none;
      touch-action: none;
    }

    .gesture-status {
      width: min(86%, 520px);
      padding: 22px 24px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      background: rgba(16, 21, 31, 0.74);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.26);
    }

    .gesture-status strong {
      display: block;
      margin-bottom: 12px;
      font-size: 22px;
      color: #fff2b7;
    }

    .gesture-status p {
      margin: 6px 0;
      color: #cddcff;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>16_01 TouchSurface gesture</h2>
    <div class="section-card">
      <p>`book/16_タッチ機能と入力.md` の `Touch.attachSurface()` を試す例です</p>
      <p class="note">surface 上で tap、double tap、long press、flick を行うと、検出結果が表示されます。desktop でも試しやすいよう `touchOnly: false` にしています</p>
    </div>

    <div class="gesture-surface" id="surface">
      <div class="gesture-status">
        <strong id="gestureTitle">waiting gesture</strong>
        <p id="gestureDetail">tap / double tap / long press / flick</p>
        <p id="gestureHint">flick は上下左右の方向を判定します</p>
      </div>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import Touch from "../../webg/Touch.js";

const surface = document.getElementById("surface");
const title = document.getElementById("gestureTitle");
const detail = document.getElementById("gestureDetail");
const hint = document.getElementById("gestureHint");

const touch = new Touch(document, {
  touchDeviceOnly: false
});

touch.attachSurface(surface, {
  touchDeviceOnly: false,
  touchOnly: false,
  minDistance: 50,
  longPressTime: 500,
  longPressMoveTolerance: 10,
  doubleTapTime: 320,
  onGesture: (gesture) => {
    title.textContent = gesture.direction
      ? `${gesture.type}: ${gesture.direction}`
      : gesture.type;
    detail.textContent = `dx=${gesture.dx.toFixed(1)} dy=${gesture.dy.toFixed(1)} distance=${gesture.distance.toFixed(1)} elapsed=${gesture.elapsedMs.toFixed(0)}ms`;
    hint.textContent = `x=${gesture.x.toFixed(1)} y=${gesture.y.toFixed(1)} pointer=${gesture.pointerType || "unknown"}`;
  }
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
