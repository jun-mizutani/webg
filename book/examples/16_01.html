  <title>16_01 Web Audio API で単音を鳴らす</title>

</head>
<body class="example-audio">
  <div class="page">
    <h1>book/examples</h1>
    <h2>16_01 Web Audio API で単音を鳴らす</h2>
    <div class="section-card">
      <p>`book/16_サウンドの設計.md` 冒頭の、ブラウザ標準の Web Audio API だけで単音を鳴らす例です</p>
      <p class="note">このページは `ToneSynth` を使わず、章の導入部にある素の `AudioContext` / `OscillatorNode` の流れを確認します</p>
      <button id="playButton">単音を鳴らす</button>
      <p id="status">status: waiting</p>
    </div>

    <pre id="code"></pre>

    <script id="example-source">
const playButton = document.getElementById("playButton");
const status = document.getElementById("status");

let audioContext = null;
let osc = null;

// 利用者の操作で音声コンテキストを作り、正弦波の音源を音量調整経由で出力へ接続する
const startAudio = () => {
  audioContext = new AudioContext();           // AudioContext を作成
  osc = audioContext.createOscillator();       // 音源 OscillatorNode を作成
  const gainNode = audioContext.createGain();  // 音量調整用 GainNode を作成
  osc.type = "sine";                           // 正弦波を指定
  osc.frequency.value = 220;                   // 周波数を220Hz（A3）へ設定する
  gainNode.gain.value = 0.2;                   // 音量を指定
  osc.connect(gainNode);                       // 接続する
  gainNode.connect(audioContext.destination);
};

// 準備した音源を開始し、音声コンテキストの時刻を基準に1秒後の終了を予約する
const playTone = () => {
  osc.start();                                 // 音を鳴らす
  osc.stop(audioContext.currentTime + 1);      // 1秒後に止める
};

playButton.addEventListener("click", () => {
  startAudio();
  playTone();
  status.textContent = "status: sine 220Hz played for 1 sec";
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
