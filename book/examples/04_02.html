<!doctype html>
<!-- book/examples/04_02.html 2026/10/04 -->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04_02 WebgApp の標準例</title>
  <link rel="stylesheet" href="./examples_common.css" />
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>04_02 WebgApp の標準例</h2>
    <div class="section-card">
      <p>04章「最小描画」のWebgAppによる立方体表示を、固定サイズのキャンバスで確認する実行ページです</p>
      <p class="note">ドラッグで orbit、ホイールで zoom、左上の help panel と status lines も一緒に確認できます</p>
    </div>

    <div class="canvas-block">
      <canvas id="canvas" width="960" height="720"></canvas>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import WebgApp from "../../webg/WebgApp.js";
import { buildHelpPanelOptions } from "../../webg/OverlayPanelPresets.js";
import Shape from "../../webg/Shape.js";
import Primitive from "../../webg/Primitive.js";

const CAMERA_CONFIG = {
  target: [0.0, 0.0, 0.0],
  distance: 8.0,
  yaw: 0.0,
  pitch: 0.0,
  roll: 0.0
};

const app = new WebgApp({
  document,
  messageFontTexture: "../../webg/font512.png",
  clearColor: [0.1, 0.15, 0.1, 1.0],
  layoutMode: "embedded",
  fixedCanvasSize: {
    width: 960,
    height: 720,
    useDevicePixelRatio: false
  },
  camera: CAMERA_CONFIG
});

await app.init();

const shape = new Shape(app.getGPU());
shape.applyPrimitiveAsset(Primitive.cube(2.0, shape.getPrimitiveOptions()));
shape.endShape();
shape.setMaterial("smooth-shader", {
  has_bone: 0,
  use_texture: 0,
  color: [1.0, 0.5, 0.3, 1.0]
});

const obj = app.space.addNode(null, "obj");
obj.addShape(shape);

const orbit = app.createOrbitEyeRig({
    target: CAMERA_CONFIG.target,
    distance: CAMERA_CONFIG.distance,
    yaw: 24.0,
    pitch: -12.0,
    minDistance: 4.0,
    maxDistance: 18.0,
    wheelZoomStep: 1.0
});

app.showOverlayPanel(buildHelpPanelOptions({
  id: "example0402Help",
  anchor: "bottom-left",
  lines: [
    "Drag: orbit",
    "Wheel: zoom",
    "F9 then M: toggle debug mode"
  ]
}));

app.message.setLines("status", [
  "Manual example",
  "WebgApp + EyeRig"
], {
  anchor: "top-left",
  x: 0,
  y: 0
});

app.start({
  // 描画の前に立方体の姿勢を更新する
  // deltaSecを毎秒の回転角度へ掛け、画面の更新頻度に合わせて進める
  // 本文の最小例と同じ速度でY軸とX軸の回転を加える
  onUpdate: ({ deltaSec }) => {
    obj.rotateY(0.8 * deltaSec);
    obj.rotateX(0.4 * deltaSec);
  }
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
