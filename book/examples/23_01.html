<html lang="ja">

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>23_01 BloomPass</title>
  <link rel="stylesheet" href="./examples_common.css" />
</head>
<body>
  <div class="page">
    <h1>book/examples</h1>
    <h2>23_01 BloomPass</h2>
    <div class="section-card">
      <p>`book/23_ポストプロセスの基本.md` の最小 bloom 例を、本文の途中でそのまま試せる埋め込み page にしたものです</p>
      <p class="note">中央の bright sphere と周回する発光球に `BloomPass` を掛けています。`B` で ON / OFF、`V` で composite / scene / extract / blurA を切り替えられます</p>
    </div>

    <div class="canvas-block">
      <canvas id="canvas" width="960" height="720"></canvas>
    </div>

    <pre id="code"></pre>

    <script type="module" id="example-source">
import WebgApp from "../../webg/WebgApp.js";
import { buildHelpPanelOptions } from "../../webg/OverlayPanelPresets.js";
import Shape from "../../webg/Shape.js";
import Primitive from "../../webg/Primitive.js";
import BloomPass from "../../webg/BloomPass.js";
import FullscreenPass from "../../webg/FullscreenPass.js";
import util from "../../webg/util.js";

const app = new WebgApp({
  document,
  messageFontTexture: "../../webg/font512.png",
  autoDrawScene: false,
  clearColor: [0.03, 0.04, 0.08, 1.0],
  layoutMode: "embedded",
  fixedCanvasSize: {
    width: 960,
    height: 720,
    useDevicePixelRatio: false
  },
  camera: {
    target: [0.0, 0.0, 0.0],
    distance: 20.0,
    yaw: 28.0,
    pitch: -10.0
  }
});
await app.init();

const orbit = app.createOrbitEyeRig({
    target: [0.0, 0.0, 0.0],
    distance: 20.0,
    yaw: 28.0,
    pitch: -10.0,
    minDistance: 10.0,
    maxDistance: 36.0
});

// 形状を組み立てる関数を実行し、GPUバッファと材質を確定したShapeを返す
const makeShape = (builder, material) => {
  const shape = new Shape(app.getGPU());
  builder(shape);
  shape.endShape();
  shape.setMaterial("smooth-shader", {
    has_bone: 0,
    ...material
  });
  return shape;
};

// 指定寸法の直方体の頂点と面を作り、呼び出し元のShapeへ渡す
const floorShape = makeShape((shape) => {
  shape.applyPrimitiveAsset(Primitive.cuboid(32.0, 0.8, 32.0, shape.getPrimitiveOptions()));
}, {
  use_texture: 0,
  color: [0.08, 0.10, 0.16, 1.0],
  ambient: 0.16,
  specular: 0.18,
  power: 12.0,
  emissive: 0.0
});
const floor = app.space.addNode(null, "floor");
floor.setPosition(0.0, -3.0, 0.0);
floor.addShape(floorShape);

// 指定半径と分割数の球の頂点と面を作り、呼び出し元のShapeへ渡す
const centerShape = makeShape((shape) => {
  shape.applyPrimitiveAsset(Primitive.sphere(3.2, 28, 20, shape.getPrimitiveOptions()));
}, {
  use_texture: 0,
  color: [1.0, 0.98, 0.88, 1.0],
  ambient: 0.74,
  specular: 1.0,
  power: 60.0,
  emissive: 1.0
});
const centerNode = app.space.addNode(null, "center");
centerNode.setPosition(0.0, 0.0, 0.0);
centerNode.addShape(centerShape);

const orbitRoot = app.space.addNode(null, "orb-root");
const orbColors = [
  [1.0, 0.62, 0.28, 1.0],
  [0.96, 0.42, 0.76, 1.0],
  [0.34, 0.78, 1.0, 1.0],
  [0.72, 1.0, 0.46, 1.0]
];
const orbs = [];
for (let i = 0; i < orbColors.length; i++) {
  // 指定半径と分割数の球の頂点と面を作り、呼び出し元のShapeへ渡す
  const orbShape = makeShape((shape) => {
    shape.applyPrimitiveAsset(Primitive.sphere(0.9, 24, 18, shape.getPrimitiveOptions()));
  }, {
    use_texture: 0,
    color: orbColors[i],
    ambient: 0.24,
    specular: 0.72,
    power: 34.0,
    emissive: 1.0
  });
  const orb = app.space.addNode(null, `orb-${i}`);
  orb.addShape(orbShape);
  orb.attach(orbitRoot);
  orbs.push(orb);
}

// 明るい領域を広めに抽出し、抽出画像と合成画像の倍率を上げて発光のにじみを見やすくします
// sceneFormatは表示用unormのため、素材値を0から1に保ち、Bloom側の抽出と合成で強さを調整します
const bloom = new BloomPass(app.getGPU(), {
  width: app.screen.getWidth(),
  height: app.screen.getHeight(),
  threshold: 0.5,
  extractIntensity: 1.5,
  softKnee: 0.34,
  bloomStrength: 2.0,
  exposure: 1.0,
  toneMapMode: 0,
  blurScale: 1.0,
  blurIterations: 2,
  blurRadius: 1.6
});
await bloom.ready;

// FullscreenPassはTone Map後のrgba8unormをcanvasへ表示する最終passです
// BloomPassのscene/extract/blur targetはcanvasと同じgpu.formatを使うため、
// 中間targetの形式を確認するデバッグ表示だけsource検証を派生クラスへ分けます
class BloomPreviewPass extends FullscreenPass {
  // BloomPass中間targetの形式を保持し、中間画像と最終表示画像の形式をそれぞれ確認します
  constructor(gpu, options = {}) {
    super(gpu, options);
    this.sourceFormat = util.readOptionalString(
      options.sourceFormat,
      "BloomPreviewPass sourceFormat",
      gpu?.format,
      { trim: true, allowEmpty: false }
    );
  }

  // BloomPass中間targetの形式とcanvas寸法、view、samplerを検証します
  // 現在のBloomPassが作った中間targetの形式を、入力形式として明示的に受け取ります
  validateSource(texture) {
    if (
      !texture
      || typeof texture.getView !== "function"
      || typeof texture.getSampler !== "function"
      || typeof texture.getFormat !== "function"
      || typeof texture.getWidth !== "function"
      || typeof texture.getHeight !== "function"
    ) {
      throw new Error("BloomPreviewPass source must be a RenderTarget-compatible texture");
    }
    const format = util.readOptionalString(
      texture.getFormat(),
      "BloomPreviewPass source format",
      undefined,
      { trim: true, allowEmpty: false }
    );
    if (format !== this.sourceFormat) {
      throw new Error(
        `BloomPreviewPass source format must be ${this.sourceFormat}; received ${format}`
      );
    }
    const width = util.readFiniteNumber(
      texture.getWidth(),
      "BloomPreviewPass source width",
      { integer: true, min: 1 }
    );
    const height = util.readFiniteNumber(
      texture.getHeight(),
      "BloomPreviewPass source height",
      { integer: true, min: 1 }
    );
    const canvasWidth = util.readFiniteNumber(
      this.gpu?.canvas?.width,
      "BloomPreviewPass canvas width",
      { integer: true, min: 1 }
    );
    const canvasHeight = util.readFiniteNumber(
      this.gpu?.canvas?.height,
      "BloomPreviewPass canvas height",
      { integer: true, min: 1 }
    );
    if (width !== canvasWidth || height !== canvasHeight) {
      throw new Error(
        `BloomPreviewPass source size ${width}x${height} does not match canvas size `
        + `${canvasWidth}x${canvasHeight}`
      );
    }
    if (!texture.getView() || !texture.getSampler()) {
      throw new Error("BloomPreviewPass source view and sampler must be ready");
    }
    return texture;
  }
}

const debugPass = new BloomPreviewPass(app.getGPU(), {
  sourceFormat: app.getGPU().format,
  targetFormat: app.getGPU().format
});
await debugPass.init();

const state = {
  bloomView: "composite"
};

const bloomViews = ["composite", "scene", "extract", "blurA"];

// 選択した確認モードからBloomの中間画像を選び、プレビューの入力として返す
const getDebugSource = () => {
  if (state.bloomView === "scene") return bloom.getSceneTarget();
  if (state.bloomView === "extract") return bloom.getExtractTarget();
  if (state.bloomView === "blurA") return bloom.getBlurTargetA();
  return null;
};

app.showOverlayPanel(buildHelpPanelOptions({
  id: "example2001Help",
  anchor: "bottom-left",
  lines: [
    "Drag: orbit camera",
    "B: bloom on/off",
    "V: composite / scene / extract / blurA"
  ]
}));

app.attachInput({
  // 正規化されたキー名から操作を選び、停止状態、表示設定、カメラなどの対象を更新する
  onKeyDown: (key, ev) => {
    if (ev.repeat) return;
    if (key === "b") {
      bloom.setEnabled(!bloom.enabled);
    } else if (key === "v") {
      const index = bloomViews.indexOf(state.bloomView);
      state.bloomView = bloomViews[(index + 1) % bloomViews.length];
    }
  }
});

let elapsedSec = 0.0;

app.start({
  // 物体を動かしてBloom画像の寸法をそろえ、効果と中間画像の確認状態を表示する
  onUpdate: ({ deltaSec, screen }) => {
    elapsedSec += deltaSec;
    bloom.resizeToScreen(screen);

    orbitRoot.setAttitude(elapsedSec * 35.0, 0.0, 0.0);
    for (let i = 0; i < orbs.length; i++) {
      const angle = (Math.PI * 2.0 * i) / orbs.length;
      const radius = 8.0;
      const height = 1.6 + Math.sin(elapsedSec * 1.6 + angle) * 1.2;
      orbs[i].setPosition(Math.cos(angle) * radius, height, Math.sin(angle) * radius);
    }

    app.message.setLines("status", [
      `bloom=${bloom.enabled ? "on" : "off"}`,
      `view=${state.bloomView}`,
      "BloomPass sample"
    ], {
      anchor: "top-left",
      x: 0,
      y: 0
    });
  },
  // 描画前にBloom用のシーン画像を生成し、後段の抽出と合成の入力を準備する
  onBeforeDraw: () => {
    bloom.beginScene(app.screen, app.clearColor);
    app.space.draw(app.eye);
  },
  // シーン画像からBloomを抽出して合成し、選択した中間画像の確認表示を行う
  onAfterDraw3d: () => {
    bloom.render(app.screen, {
      source: bloom.getSceneTarget(),
      clearColor: app.clearColor
    });

    const debugSource = getDebugSource();
    if (debugSource) {
      app.screen.beginPresentPass({
        clearColor: app.clearColor,
        colorLoadOp: "clear"
      });
      debugPass.draw(debugSource);
    }

    app.screen.clearDepthBuffer();
  }
});
    </script>
    <script>
      document.getElementById("code").textContent =
        document.getElementById("example-source").textContent.trim();
    </script>
  </div>
</body>
</html>
